<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE SEVEN — Dark Myths of Central Asia</title>
<meta name="description" content="A field dossier of 26 dark myths, sacred curses and places of silence across Central Asia — mapped against the seven deadly sins.">
<style>
/* ═══════════════════════════════════════════════════════════════
   THE SEVEN · art direction
   palette: void / blood / bone / ash
   ═══════════════════════════════════════════════════════════════ */
:root{
  --void:#050406;
  --void-2:#08070a;
  --panel:#0b0910;
  --panel-2:#0f0c13;
  --bone:#ece5d9;
  --bone-dim:#bdb2a4;
  --muted:#8d8278;
  --muted-2:#6a6058;
  --blood:#9d1119;
  --blood-2:#d4202c;
  --blood-3:#ff4a55;
  --gild:#b08a4a;
  --line:rgba(236,229,217,.10);
  --line-2:rgba(236,229,217,.055);
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --maxw:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--void);color:var(--bone);
  font-family:var(--sans);font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
::selection{background:rgba(157,17,25,.55);color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,svg{display:block;max-width:100%}

/* scrollbar */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:#07060a}
*::-webkit-scrollbar-thumb{background:#241c22;border-radius:0;border:2px solid #07060a}
*::-webkit-scrollbar-thumb:hover{background:var(--blood)}

/* ── atmosphere ─────────────────────────────────────────────── */
.grain,.vignette,.glowfield{position:fixed;inset:0;pointer-events:none;z-index:1}
.grain{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.42'/></svg>");
  opacity:.16;mix-blend-mode:overlay;
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 50% 0%,transparent 35%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.88) 100%)}
.glowfield{
  background:
    radial-gradient(58% 42% at 50% -6%, rgba(157,17,25,.30), transparent 62%),
    radial-gradient(40% 30% at 88% 18%, rgba(157,17,25,.10), transparent 70%),
    radial-gradient(46% 34% at 6% 62%, rgba(80,10,16,.14), transparent 72%);
  z-index:0;
}
.rule-top{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--blood),var(--blood-3));z-index:60;box-shadow:0 0 18px rgba(212,32,44,.65);transition:width .12s linear}

/* ── veil / enter ───────────────────────────────────────────── */
#veil{
  position:fixed;inset:0;z-index:200;background:
    radial-gradient(60% 50% at 50% 40%,rgba(157,17,25,.16),transparent 70%),#040305;
  display:grid;place-items:center;text-align:center;padding:32px;
  transition:opacity 1.15s var(--ease),visibility 1.15s;
}
#veil.gone{opacity:0;visibility:hidden}
.veil-inner{max-width:640px}
.veil-sigil{width:96px;height:96px;margin:0 auto 30px;animation:slowspin 44s linear infinite;opacity:.92}
@keyframes slowspin{to{transform:rotate(360deg)}}
.veil-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}
.veil-title{font-family:var(--serif);font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:.14em;margin:20px 0 10px;color:var(--bone);text-transform:uppercase}
.veil-sub{color:var(--bone-dim);font-size:14.5px;max-width:460px;margin:0 auto 34px;line-height:1.7}
.veil-sub em{color:var(--bone);font-style:normal}
.btn-enter{
  position:relative;display:inline-flex;align-items:center;gap:14px;padding:17px 42px;
  border:1px solid rgba(212,32,44,.55);color:var(--bone);
  font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(157,17,25,.20),rgba(157,17,25,.04));
  transition:all .5s var(--ease);
}
.btn-enter:hover{border-color:var(--blood-3);background:linear-gradient(180deg,rgba(212,32,44,.34),rgba(157,17,25,.08));letter-spacing:.4em;box-shadow:0 0 44px rgba(212,32,44,.28)}
.btn-enter .pulse{width:6px;height:6px;background:var(--blood-3);border-radius:50%;box-shadow:0 0 0 0 rgba(255,74,85,.7);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,74,85,0)}100%{box-shadow:0 0 0 0 rgba(255,74,85,0)}}
.veil-note{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--muted-2);margin-top:26px;text-transform:uppercase;line-height:2}

/* ── nav ────────────────────────────────────────────────────── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:70;
  display:flex;align-items:center;gap:26px;padding:0 clamp(16px,3vw,38px);height:66px;
  background:linear-gradient(180deg,rgba(5,4,6,.92),rgba(5,4,6,.62));
  backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);
  border-bottom:1px solid var(--line-2);
  transform:translateY(-100%);transition:transform .8s var(--ease);
}
body.awake .topbar{transform:translateY(0)}
.wordmark{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.wordmark svg{width:22px;height:22px}
.wordmark span{font-family:var(--serif);font-size:14.5px;letter-spacing:.30em;text-transform:uppercase}
.wordmark b{color:var(--blood-2);font-weight:400}
.navlinks{display:flex;gap:2px;margin-left:auto;flex-wrap:nowrap;overflow:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--muted);
  padding:9px 11px;border-radius:0;position:relative;white-space:nowrap;transition:color .35s
}
.navlinks a::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:1px;background:var(--blood-2);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.navlinks a:hover{color:var(--bone)}
.navlinks a:hover::after,.navlinks a.on::after{transform:scaleX(1)}
.navlinks a.on{color:var(--bone)}
.bar-tools{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-left:12px;border-left:1px solid var(--line-2)}
.lang{display:flex;border:1px solid var(--line);padding:2px}
.lang button{font-family:var(--mono);font-size:9px;letter-spacing:.16em;padding:5px 9px;color:var(--muted);transition:.3s}
.lang button.on{background:var(--blood);color:#fff}
.lang button:not(.on):hover{color:var(--bone)}
.snd{width:34px;height:30px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);transition:.35s}
.snd:hover{color:var(--bone);border-color:rgba(212,32,44,.5)}
.snd.on{color:var(--blood-3);border-color:rgba(212,32,44,.5)}
.snd svg{width:15px;height:15px}
.burger{display:none}
/* mobile: horizontal-scroll affordance for the 26 × 7 matrix */
.mtx-hint{display:none}
@media (max-width:900px){
  .mtx-hint{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:13px;font-family:var(--mono);font-size:8px;letter-spacing:.2em;white-space:nowrap;
    text-transform:uppercase;color:var(--muted-2);
  }
  .mtx-hint .bar{
    position:relative;width:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(192,57,44,.55),transparent);
  }
  .mtx-hint .bar::after{
    content:"";position:absolute;top:-2px;left:0;width:6px;height:5px;
    background:var(--blood-2);border-radius:50%;
    animation:mtxSlide 2.6s cubic-bezier(.45,0,.55,1) infinite;
  }
  .mtx-hint.done{opacity:.25}
  @keyframes mtxSlide{0%{left:0;opacity:0}18%{opacity:1}82%{opacity:1}100%{left:40px;opacity:0}}
}

/* ── layout primitives ──────────────────────────────────────── */
main{position:relative;z-index:2}
section.band{padding:clamp(72px,10vw,132px) clamp(18px,4vw,56px);position:relative}
.wrap{max-width:var(--maxw);margin:0 auto;position:relative}
.band + .band{border-top:1px solid var(--line-2)}
.sec-head{display:flex;align-items:flex-end;gap:26px;margin-bottom:clamp(34px,5vw,58px);position:relative}
.sec-num{
  font-family:var(--serif);font-size:clamp(64px,11vw,150px);line-height:.72;color:transparent;
  -webkit-text-stroke:1px rgba(236,229,217,.13);flex:0 0 auto;letter-spacing:-.02em;user-select:none
}
.sec-titles{flex:1 1 auto;padding-bottom:6px;min-width:0}
.kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.40em;text-transform:uppercase;color:var(--blood-2);margin:0 0 12px}
.sec-titles h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.2vw,52px);line-height:1.02;letter-spacing:-.012em;margin:0}
.sec-titles p{margin:16px 0 0;color:var(--muted);max-width:64ch;font-size:14.6px;line-height:1.75}
.sec-head .tail{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--muted-2);text-transform:uppercase;text-align:right;line-height:1.9;flex:0 0 auto}

/* ── hero ───────────────────────────────────────────────────── */
#hero{
  min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;
  padding:120px 22px 80px;text-align:center;
}
.hero-compass{position:absolute;top:50%;left:50%;width:min(112vh,96vw);height:min(112vh,96vw);transform:translate(-50%,-50%);opacity:.30;pointer-events:none}
.hero-compass .spin{animation:slowspin 150s linear infinite;transform-origin:300px 300px}
.hero-inner{position:relative;z-index:3;max-width:960px}
.hero-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.46em;text-transform:uppercase;color:var(--blood-2);margin-bottom:26px}
.hero-kicker i{font-style:normal;color:var(--muted-2);letter-spacing:.2em}
h1.hero-title{
  font-family:var(--serif);font-weight:400;font-size:clamp(52px,13vw,168px);line-height:.82;letter-spacing:-.02em;
  margin:0;text-transform:uppercase;
  background:linear-gradient(178deg,#fff8ef 8%,#d8ccbc 46%,#8d7f72 78%,#4a3f3a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 18px 44px rgba(0,0,0,.75));
}
.hero-title span{display:block}
.hero-rule{width:1px;height:64px;background:linear-gradient(180deg,var(--blood-2),transparent);margin:34px auto 26px}
.hero-lede{font-family:var(--serif);font-size:clamp(16px,2vw,20.5px);line-height:1.66;color:var(--bone-dim);max-width:640px;margin:0 auto}
.hero-lede b{color:var(--bone);font-weight:400}
.hero-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin:44px auto 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);max-width:760px}
.hero-meta div{padding:16px 26px;border-right:1px solid var(--line-2);flex:1 1 120px}
.hero-meta div:last-child{border-right:0}
.hero-meta b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1;color:var(--bone)}
.hero-meta span{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);white-space:nowrap}
.scroll-cue{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;letter-spacing:.34em;color:var(--muted-2);text-transform:uppercase;z-index:3}
.scroll-cue::after{content:"";display:block;width:1px;height:38px;margin:10px auto 0;background:linear-gradient(180deg,var(--blood),transparent);animation:drop 2.6s var(--ease) infinite}
@keyframes drop{0%{transform:scaleY(.2);transform-origin:top;opacity:0}40%{transform:scaleY(1);opacity:1}100%{transform:scaleY(.2);transform-origin:bottom;opacity:0}}

/* ── sins ───────────────────────────────────────────────────── */
.sin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.sin{
  position:relative;background:var(--void-2);padding:26px 24px 22px;min-height:262px;
  display:flex;flex-direction:column;transition:background .5s var(--ease);overflow:hidden;text-align:left;width:100%
}
.sin::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--blood),var(--blood-3),transparent);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.sin:hover{background:var(--panel)}
.sin:hover::before,.sin.on::before{transform:scaleX(1)}
.sin-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:auto}
.sin-n{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--muted-2)}
.sin-glyph{width:44px;height:44px;color:var(--muted-2);transition:.6s var(--ease)}
.sin:hover .sin-glyph{color:var(--blood-2);transform:rotate(-6deg) scale(1.06)}
.sin h3{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.06;margin:20px 0 4px;letter-spacing:.005em}
.sin .la{font-family:var(--mono);font-size:9px;letter-spacing:.30em;text-transform:uppercase;color:var(--blood-2);margin-bottom:12px}
.sin .gloss{color:var(--muted);font-size:12.8px;line-height:1.6;margin:0}
.sin .meter{display:flex;align-items:center;gap:9px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line-2)}
.sin .meter i{height:2px;flex:1;background:linear-gradient(90deg,var(--blood),rgba(212,32,44,.15))}
.sin .meter em{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--muted-2)}

/* ── filter bar ─────────────────────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px;align-items:center}
.filters .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted-2);margin-right:8px}
.chip{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);padding:7px 12px;transition:.35s;white-space:nowrap
}
.chip:hover{color:var(--bone);border-color:rgba(212,32,44,.55)}
.chip.on{background:var(--blood);border-color:var(--blood);color:#fff}

/* ── bestiary cards ─────────────────────────────────────────── */
.best-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{
  position:relative;border:1px solid var(--line);background:
    linear-gradient(168deg,rgba(15,12,19,.92),rgba(8,7,10,.96));
  padding:26px 24px 20px;overflow:hidden;transition:transform .6s var(--ease),border-color .5s,box-shadow .6s;text-align:left;width:100%;display:flex;flex-direction:column;min-height:100%
}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(78% 60% at 50% 0%,rgba(157,17,25,.16),transparent 68%);opacity:0;transition:opacity .6s;pointer-events:none}
.card:hover{transform:translateY(-4px);border-color:rgba(157,17,25,.55);box-shadow:0 26px 60px -28px rgba(0,0,0,.95),0 0 0 1px rgba(157,17,25,.12)}
.card:hover::after{opacity:1}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:relative;z-index:2}
.card-idx{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted-2)}
.card-ix{font-family:var(--serif);font-size:30px;line-height:1;color:var(--blood-2);opacity:.92}
.card-ix small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;color:var(--muted-2);margin-top:4px;text-align:right}
.card h3{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.1;margin:16px 0 6px;position:relative;z-index:2}
.card .sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;position:relative;z-index:2}
.card .gist{color:var(--bone-dim);font-size:13.2px;line-height:1.66;margin:0;position:relative;z-index:2}
.card-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:18px;position:relative;z-index:2;flex-wrap:wrap}
.mini-sin{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--line);padding:4px 7px}
.mini-sin.hot{color:#ffb3b8;border-color:rgba(212,32,44,.42);background:rgba(157,17,25,.13)}
.card-arrow{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-2);transition:.45s var(--ease)}
.card:hover .card-arrow{color:var(--blood-3);transform:translateX(4px)}

/* ── timeline (curses) ──────────────────────────────────────── */
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,transparent,var(--line),var(--line),transparent)}
.tl-item{position:relative;padding:0 0 34px;text-align:left;width:100%;background:none;border:0;display:block}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-34px;top:9px;width:11px;height:11px;border:1px solid var(--blood);background:var(--void);transition:.5s var(--ease);transform:rotate(45deg)}
.tl-item:hover::before{background:var(--blood);box-shadow:0 0 18px rgba(212,32,44,.7)}
.tl-item .yr{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--blood-2);text-transform:uppercase}
.tl-item h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.14;margin:8px 0 8px;transition:color .4s}
.tl-item:hover h3{color:#fff}
.tl-item p{color:var(--muted);font-size:13.4px;line-height:1.7;margin:0;max-width:78ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tl-item .tagline{display:inline-flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tl-item .tagline span{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--line);padding:4px 7px}

/* ── geography ──────────────────────────────────────────────── */
.geo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.geo{position:relative;background:var(--void-2);padding:24px 22px;text-align:left;width:100%;overflow:hidden;transition:background .5s}
.geo:hover{background:var(--panel)}
.geo .coord{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--muted-2);display:flex;justify-content:space-between;gap:10px}
.geo h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:16px 0 6px;line-height:1.1}
.geo .rg{font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--blood-2);margin-bottom:12px}
.geo p{color:var(--muted);font-size:12.8px;line-height:1.65;margin:0}
.geo .bar{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line-2)}
.geo .bar i{height:1px;flex:1;background:linear-gradient(90deg,var(--blood),rgba(212,32,44,.06))}
.geo .bar em{font-family:var(--mono);font-style:normal;font-size:8.5px;letter-spacing:.14em;color:var(--muted-2)}

/* ── matrix ─────────────────────────────────────────────────── */
.matrix-scroll{overflow:auto;border:1px solid var(--line-2);background:rgba(8,7,10,.7);max-height:none}
table.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-family:var(--sans)}
table.matrix th,table.matrix td{padding:0;border-bottom:1px solid var(--line-2);text-align:center;font-weight:400}
table.matrix thead th{
  position:sticky;top:0;z-index:3;background:#0a0810;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:14px 8px;border-bottom:1px solid var(--line);white-space:nowrap
}
table.matrix thead th.rot{cursor:pointer}
table.matrix thead th.rot:hover span{color:var(--bone)}
table.matrix thead th.rot span{display:block;transform:rotate(-32deg);transform-origin:center;white-space:nowrap;font-size:8px;letter-spacing:.12em}
table.matrix th.rowh{
  text-align:left;padding:11px 14px;position:sticky;left:0;z-index:2;background:#0a0810;
  border-right:1px solid var(--line);min-width:216px;cursor:pointer
}
table.matrix th.rowh:hover{background:#120d16}
table.matrix th.rowh .nm{font-family:var(--serif);font-size:15px;color:var(--bone);line-height:1.2;display:block}
table.matrix th.rowh .tp{font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-top:3px;display:block}
table.matrix td.cell{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.82);width:1%;cursor:default;transition:.25s}
table.matrix tr:hover td.cell{filter:brightness(1.28)}
table.matrix td.cell.zero{color:var(--muted-2)}
table.matrix td.tot{font-family:var(--mono);font-size:10px;color:var(--bone);background:rgba(157,17,25,.10);border-left:1px solid var(--line)}
.legend{display:flex;align-items:center;gap:12px;margin:18px 0 0;flex-wrap:wrap;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.legend .scale{display:flex;height:8px;width:190px}
.legend .scale i{flex:1}

/* aggregate bars */
.agg{margin-top:38px;border-top:1px solid var(--line-2);padding-top:26px}
.agg-row{display:grid;grid-template-columns:180px 1fr 62px;align-items:center;gap:16px;padding:9px 0}
.agg-row .nm{font-family:var(--serif);font-size:16px;color:var(--bone-dim)}
.agg-row .track{height:5px;background:rgba(236,229,217,.05);position:relative;overflow:hidden}
.agg-row .track i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,var(--blood),var(--blood-3));width:0;transition:width 1.5s var(--ease)}
.agg-row .val{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:right}

/* ── doctrine ───────────────────────────────────────────────── */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.doc{background:var(--void-2);padding:26px 24px}
.doc .n{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--blood-2);text-transform:uppercase}
.doc h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:12px 0 10px;line-height:1.2}
.doc p{color:var(--muted);font-size:12.9px;line-height:1.7;margin:0}
.term-table{margin-top:34px;width:100%;border-collapse:collapse;font-size:13px}
.term-table th,.term-table td{padding:12px 14px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.term-table th{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);font-weight:400;background:rgba(236,229,217,.015)}
.term-table td:nth-child(1){font-family:var(--serif);font-size:15px;color:var(--bone)}
.term-table td:nth-child(2){font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--blood-2)}
.term-table td:nth-child(3){color:var(--muted);font-size:12.4px}

/* ── craft ──────────────────────────────────────────────────── */
.craft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(276px,1fr));gap:16px}
.craft{border:1px solid var(--line);padding:24px 22px;background:linear-gradient(170deg,rgba(15,12,19,.85),rgba(8,7,10,.92));position:relative;overflow:hidden}
.craft h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 10px}
.craft p{color:var(--muted);font-size:12.9px;line-height:1.7;margin:0}
.craft .k{font-family:var(--mono);font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--blood-2);margin-bottom:12px}
.craft::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--blood),transparent 70%)}
.rules{margin-top:30px;border:1px solid rgba(157,17,25,.30);background:linear-gradient(140deg,rgba(157,17,25,.10),rgba(8,7,10,.5));padding:28px 26px}
.rules h3{font-family:var(--serif);font-size:22px;font-weight:400;margin:0 0 16px}
.rules ol{margin:0;padding-left:20px;color:var(--bone-dim);font-size:13.6px;line-height:1.8}
.rules li{margin-bottom:9px}
.rules li b{color:var(--bone);font-weight:600}

/* ── sources ────────────────────────────────────────────────── */
.src-grid{columns:2;column-gap:44px}
@media (max-width:820px){.src-grid{columns:1}}
.src-block{break-inside:avoid;margin-bottom:30px}
.src-block h3{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--blood-2);margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line-2)}
.src-block p{margin:0 0 9px;font-size:12.6px;color:var(--muted);line-height:1.62;padding-left:14px;position:relative}
.src-block p::before{content:"";position:absolute;left:0;top:8px;width:5px;height:1px;background:var(--blood)}

/* ── footer ─────────────────────────────────────────────────── */
footer{border-top:1px solid var(--line);padding:56px clamp(18px,4vw,56px) 44px;position:relative;z-index:2;background:#040305}
.foot-in{max-width:var(--maxw);margin:0 auto;display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start;justify-content:space-between}
.foot-brand{font-family:var(--serif);font-size:clamp(30px,5vw,54px);line-height:.95;letter-spacing:.1em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px rgba(236,229,217,.22)}
.foot-col{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted-2);line-height:2.2;text-transform:uppercase;max-width:300px}
.foot-col b{display:block;color:var(--bone-dim);margin-bottom:8px;font-weight:400;letter-spacing:.24em}

/* ── drawer ─────────────────────────────────────────────────── */
#scrim{position:fixed;inset:0;background:rgba(2,1,3,.72);backdrop-filter:blur(6px);z-index:90;opacity:0;visibility:hidden;transition:.5s}
#scrim.on{opacity:1;visibility:visible}
#drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:95;background:
    linear-gradient(180deg,#0a0810,#060409 60%,#040305);
  border-left:1px solid rgba(157,17,25,.35);
  transform:translateX(102%);transition:transform .62s var(--ease);
  display:flex;flex-direction:column;box-shadow:-40px 0 90px -30px rgba(0,0,0,.95)
}
#drawer.on{transform:translateX(0)}
.dr-head{padding:22px 28px 18px;border-bottom:1px solid var(--line-2);position:relative;flex:0 0 auto}
.dr-close{position:absolute;top:16px;right:18px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);transition:.4s}
.dr-close:hover{color:#fff;border-color:var(--blood);background:rgba(157,17,25,.2)}
.dr-kind{font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--blood-2)}
.dr-title{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.04;margin:12px 34px 6px 0}
.dr-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.dr-body{overflow-y:auto;padding:24px 28px 40px;flex:1 1 auto}
.dr-para{color:var(--bone-dim);font-size:14.2px;line-height:1.82;margin:0 0 22px}
.dr-sec{border-top:1px solid var(--line-2);padding-top:16px;margin-top:20px}
.dr-sec h4{font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted-2);margin:0 0 9px;font-weight:400}
.dr-sec p{margin:0;font-size:13.2px;line-height:1.72;color:var(--bone-dim)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.bar-row{display:grid;grid-template-columns:112px 1fr 26px;align-items:center;gap:11px}
.bar-row .l{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar-row .t{height:4px;background:rgba(236,229,217,.06);position:relative}
.bar-row .t i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#7c0d14,var(--blood-2));transform:scaleX(0);transition:transform .9s var(--ease)}
.bar-row .v{font-family:var(--mono);font-size:9.5px;color:var(--bone-dim);text-align:right}
.prov{border:1px solid var(--line);background:rgba(236,229,217,.018);padding:14px 15px;margin:6px 0 20px}
.prov-h{font-family:var(--mono);font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted-2);margin-bottom:9px}
.prov-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:5px 0}
.prov-row i{width:5px;height:5px;background:var(--blood);flex:0 0 auto;transform:rotate(45deg)}
.prov-row b{color:var(--bone-dim);font-weight:400}
.prov-note{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;line-height:1.95;color:var(--muted-2);margin-top:10px}
.sin-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.sin-list span{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--line);padding:5px 8px;cursor:pointer;transition:.3s}
.sin-list span:hover{color:#fff;border-color:var(--blood);background:rgba(157,17,25,.22)}
.dr-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.dr-meta span{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--line);padding:5px 8px}

/* ── audio dock (collapsed pill → expands on hover) ────────── */
#dock{
  position:fixed;left:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:10px;
  background:rgba(9,7,12,.94);border:1px solid var(--line);padding:6px;
  backdrop-filter:blur(12px);transition:.6s var(--ease);transform:translateY(160%);max-width:calc(100vw - 36px);
  box-shadow:0 18px 40px -22px #000
}
body.awake #dock{transform:translateY(0)}
#dock .play{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(157,17,25,.5);background:rgba(157,17,25,.18);color:var(--bone);transition:.4s;flex:0 0 auto}
#dock .play:hover{background:var(--blood);color:#fff}
#dock .play svg{width:12px;height:12px}
.dock-meta{min-width:0;width:0;overflow:hidden;opacity:0;transition:.55s var(--ease);white-space:nowrap}
.dock-t{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);white-space:nowrap}
.dock-s{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-top:2px;white-space:nowrap}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;flex:0 0 auto;margin:0 4px}
.eq i{width:2px;background:var(--blood-2);height:20%;opacity:.35;transition:.3s}
.eq.live i{animation:eqb 1.1s infinite ease-in-out;opacity:1}
.eq.live i:nth-child(2){animation-delay:.18s}.eq.live i:nth-child(3){animation-delay:.36s}.eq.live i:nth-child(4){animation-delay:.54s}
@keyframes eqb{0%,100%{height:18%}50%{height:100%}}
#vol{width:0;opacity:0;accent-color:var(--blood-2);height:2px;cursor:pointer;transition:.55s var(--ease);pointer-events:none}
#dock:hover .dock-meta,#dock:focus-within .dock-meta{width:176px;opacity:1}
#dock:hover #vol,#dock:focus-within #vol{width:64px;opacity:1;pointer-events:auto}

/* ── reveal ─────────────────────────────────────────────────── */
[data-reveal]{opacity:0;transform:translateY(26px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
[data-reveal].in{opacity:1;transform:none}

/* ── responsive ─────────────────────────────────────────────── */
@media (max-width:1080px){
  .navlinks{display:none}
  .burger{display:grid;place-items:center;flex:0 0 36px;width:36px;min-width:36px;height:34px;border:1px solid rgba(236,229,217,.24);color:var(--bone-dim);background:rgba(236,229,217,.04);margin-left:auto;overflow:visible}
  .burger svg{width:17px;height:17px;flex:0 0 17px;display:block}
  .topbar{gap:12px}
  .bar-tools{padding-left:0;border-left:0}
}
@media (max-width:820px){
  .sec-head{flex-wrap:wrap;gap:14px}
  .sec-head .tail{display:none}
  .sec-num{font-size:74px}
  .hero-meta div{padding:13px 16px;flex-basis:50%}
  .hero-meta div:nth-child(2n){border-right:0}
  .hero-meta div:nth-child(1),.hero-meta div:nth-child(2){border-bottom:1px solid var(--line-2)}
  .agg-row{grid-template-columns:120px 1fr 46px;gap:10px}
  .agg-row .nm{font-size:14px}
  #dock{left:12px;bottom:12px;right:12px}
}
@media (max-width:600px){
  body{font-size:15px}
  h1.hero-title{font-size:clamp(46px,17vw,84px)}
  .hero-lede{font-size:15.5px}
  .sec-titles p{font-size:13.6px}
  .sin-grid,.geo-grid{grid-template-columns:1fr}
  .best-grid{grid-template-columns:1fr}
  .tl{padding-left:26px}
  .tl-item::before{left:-26px;width:9px;height:9px}
  .dr-title{font-size:26px}
  .term-table th:nth-child(3),.term-table td:nth-child(3){display:none}
  .lang button{padding:5px 7px;font-size:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  [data-reveal]{opacity:1;transform:none}
}

<main>
